    <!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin | Lapor Pak</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f7fa;
            color: #173c5b;
            min-height: 100vh;
        }


        .container {
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
            padding: 25px 15px 45px;
        }


        /* =========================
           HEADER
        ========================== */

        .header {
            background: #ffffff;
            border-radius: 12px;
            padding: 22px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.06);
        }


        .header-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
        }


        .header-title h1 {
            color: #173c5b;
            font-size: 26px;
            margin-bottom: 6px;
        }


        .header-title p {
            color: #7891a5;
            font-size: 13px;
            line-height: 1.5;
        }


        /* =========================
           SEARCH + JUMLAH LAPORAN
        ========================== */

        .header-tools {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }


        .search-input {
            width: 240px;
            height: 38px;
            padding: 0 14px;
            border: 1px solid #d5dfe7;
            border-radius: 8px;
            background: #f8fafc;
            color: #173c5b;
            font-family: inherit;
            font-size: 12px;
            outline: none;
            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease,
                background 0.2s ease;
        }


        .search-input::placeholder {
            color: #8d9ba6;
        }


        .search-input:focus {
            background: #ffffff;
            border-color: #073b63;
            box-shadow: 0 0 0 3px rgba(7, 59, 99, 0.12);
        }


        .jumlah-laporan {
            flex-shrink: 0;
            background: #eef4f8;
            color: #173c5b;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 700;
            white-space: nowrap;
        }


        /* =========================
           LIST
           (background di bawah kartu laporan)
        ========================== */

        .pengaduan-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
            background: #dbe6ef;
            padding: 16px;
            border-radius: 12px;
        }


        /* =========================
           CARD
        ========================== */

        .pengaduan-card {
            background: #ffffff;
            border-radius: 12px;
            padding: 20px;
            border: 1px solid #e8edf2;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }


        .card-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 15px;
            margin-bottom: 16px;
        }


        .card-title h2 {
            color: #173c5b;
            font-size: 20px;
            margin-bottom: 5px;
            line-height: 1.3;
        }


        .card-id {
            color: #9aa7b0;
            font-size: 10px;
            word-break: break-all;
        }


        /* =========================
           STATUS
        ========================== */

        .status {
            flex-shrink: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 7px 11px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 700;
            white-space: nowrap;
        }


        .status.menunggu {
            background: #fff3cd;
            color: #856404;
        }


        .status.dikonfirmasi {
            background: #cfe2ff;
            color: #084298;
        }


        .status.selesai {
            background: #d1e7dd;
            color: #0f5132;
        }


        .status.ditutup {
            background: #e2e3e5;
            color: #41464b;
        }


        /* =========================
           INFO
        ========================== */

        .info-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 10px;
            margin-bottom: 16px;
        }


        .info {
            background: #f8fafc;
            border-radius: 8px;
            padding: 11px 12px;
        }


        .info-label {
            display: block;
            color: #8d9ba6;
            font-size: 9px;
            margin-bottom: 4px;
        }


        .info-value {
            display: block;
            color: #173c5b;
            font-size: 11px;
            font-weight: 600;
            word-break: break-word;
        }


        /* =========================
           DESKRIPSI
        ========================== */

        .description {
            background: #f8fafc;
            border-radius: 8px;
            padding: 12px;
            color: #4e6472;
            font-size: 11px;
            line-height: 1.6;
            margin-bottom: 16px;
        }


        .description-title {
            display: block;
            color: #173c5b;
            font-size: 10px;
            font-weight: 700;
            margin-bottom: 5px;
        }


        /* =========================
           TINDAKAN
        ========================== */

        .tindakan {
            background: #eef4f8;
            border-left: 4px solid #073b63;
            border-radius: 6px;
            padding: 11px 12px;
            margin-bottom: 18px;
            color: #4e6472;
            font-size: 11px;
            line-height: 1.5;
        }


        .tindakan-title {
            display: block;
            color: #173c5b;
            font-weight: 700;
            font-size: 10px;
            margin-bottom: 4px;
        }


        /* =========================
           ACTION BUTTON
        ========================== */

        .actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            padding-top: 15px;
            border-top: 1px solid #edf0f2;
        }


        .btn {
            min-height: 42px;
            padding: 10px 17px;
            border: none;
            border-radius: 7px;
            color: white;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            transition:
                background 0.2s ease,
                transform 0.15s ease,
                opacity 0.2s ease;
        }


        .btn:active {
            transform: scale(0.97);
        }


        .btn:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }


        .btn-konfirmasi {
            background: #073b63;
        }


        .btn-konfirmasi:hover {
            background: #0a4d80;
        }


        .btn-selesai {
            background: #198754;
        }


        .btn-selesai:hover {
            background: #157347;
        }


        .btn-ditutup {
            background: #6c757d;
        }


        .btn-ditutup:hover {
            background: #5c636a;
        }


        /* =========================
           STATUS AKHIR
        ========================== */

        .status-final {
            padding-top: 12px;
            color: #627583;
            font-size: 11px;
            font-weight: 600;
        }


        /* =========================
           LOADING
        ========================== */

        .loading {
            background: #ffffff;
            border-radius: 12px;
            padding: 40px 20px;
            text-align: center;
            color: #8193a0;
            font-size: 13px;
        }


        /* =========================
           EMPTY
        ========================== */

        .empty {
            background: #ffffff;
            border-radius: 12px;
            padding: 45px 20px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }


        .empty-icon {
            font-size: 35px;
            margin-bottom: 10px;
        }


        .empty h2 {
            color: #173c5b;
            font-size: 17px;
            margin-bottom: 5px;
        }


        .empty p {
            color: #8193a0;
            font-size: 12px;
            word-break: break-word;
        }


        /* =========================
           ERROR
        ========================== */

        .error {
            background: #fff1f2;
            border: 1px solid #f3c2c7;
            border-radius: 10px;
            padding: 17px;
            color: #842029;
            font-size: 11px;
            line-height: 1.5;
        }


        /* =========================
           MOBILE
        ========================== */

        @media (max-width: 650px) {

            .container {
                padding: 15px 12px 30px;
            }


            .header {
                padding: 17px;
            }


            .header-top {
                flex-direction: column;
                align-items: stretch;
            }


            .header-title h1 {
                font-size: 20px;
            }


            .header-title p {
                font-size: 11px;
            }


            .header-tools {
                width: 100%;
            }


            .search-input {
                flex: 1;
                width: auto;
                min-width: 0;
                font-size: 16px; /* mencegah zoom otomatis di iPhone */
            }


            .jumlah-laporan {
                font-size: 10px;
                padding: 8px 10px;
            }


            .pengaduan-list {
                padding: 10px;
            }


            .pengaduan-card {
                padding: 15px;
            }


            .card-header {
                flex-direction: column;
            }


            .card-title h2 {
                font-size: 17px;
            }


            .info-grid {
                grid-template-columns: 1fr;
            }


            .actions {
                flex-direction: column;
            }


            .btn {
                width: 100%;
            }

        }

    </style>

</head>


<body>


    <div class="container">


        <!-- =========================
             HEADER
        ========================== -->

        <div class="header">

            <div class="header-top">

                <div class="header-title">

                    <h1>Panel Admin</h1>

                    <p>Kelola dan proses laporan pengaduan</p>

                </div>


                <div class="header-tools">

                    <input
                        type="search"
                        id="cari-laporan"
                        class="search-input"
                        placeholder="Cari laporan..."
                        aria-label="Cari laporan"
                        autocomplete="off"
                    >

                    <div
                        class="jumlah-laporan"
                        id="jumlah-laporan"
                    >
                        0 Laporan
                    </div>

                </div>

            </div>

        </div>


        <!-- =========================
             LIST PENGADUAN
        ========================== -->

        <div
            class="pengaduan-list"
            id="pengaduan-list"
        >

            <div class="loading">
                Memuat laporan...
            </div>

        </div>

    </div>


    <script type="module">

        // ===========================================
        // FIREBASE
        // ===========================================

        import { db } from "../js/firebase-config.js";


        import {
            collection,
            onSnapshot,
            doc,
            updateDoc,
            serverTimestamp
        } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


        // ===========================================
        // ELEMENT
        // ===========================================

        const daftarPengaduan = document.getElementById("pengaduan-list");

        const jumlahLaporan = document.getElementById("jumlah-laporan");

        const inputCari = document.getElementById("cari-laporan");


        // ===========================================
        // STATE
        // ===========================================

        // Semua laporan dari Firestore: [{ id, data }]
        let semuaPengaduan = [];

        // Kata kunci pencarian saat ini
        let kataCari = "";


        // ===========================================
        // URUTAN LAPORAN (terbaru -> terlama)
        //
        // Isi daftar ini dengan nama field di Firestore yang
        // menyimpan WAKTU LAPORAN DIKIRIM. Field pertama yang
        // ditemukan pada sebuah laporan akan dipakai.
        // ===========================================

        const FIELD_WAKTU_LAPOR = [
            "createdAt",
            "dibuatPada",
            "tanggalLapor",
            "waktuLapor",
            "timestamp",
            "tanggal"
        ];


        function keMillis(value) {

            if (!value) return 0;

            // Firestore Timestamp
            if (typeof value.toMillis === "function") {
                return value.toMillis();
            }

            if (value instanceof Date) {
                return value.getTime();
            }

            if (typeof value === "number") {
                return value;
            }

            if (typeof value === "string") {
                const t = Date.parse(value);
                return Number.isNaN(t) ? 0 : t;
            }

            return 0;

        }


        function ambilWaktuLaporan(data) {

            for (const field of FIELD_WAKTU_LAPOR) {

                const ms = keMillis(data[field]);

                if (ms) return ms;

            }

            // Cadangan: laporan lama tanpa field waktu kirim
            // memakai waktu kejadian, jika bisa dibaca.
            return keMillis(data.waktuKejadian);

        }


        function bandingkanTerbaru(a, b) {

            return ambilWaktuLaporan(b.data) - ambilWaktuLaporan(a.data);

        }


        // ===========================================
        // ESCAPE HTML
        // ===========================================

        function escapeHTML(value) {

            if (value === null || value === undefined) {
                return "";
            }

            return String(value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");

        }


        // ===========================================
        // NORMALISASI STATUS
        // Status selain Dikonfirmasi / Selesai / Ditutup
        // (mis. "Menunggu", "Terkirim", kosong) dianggap
        // laporan baru yang belum dikonfirmasi.
        // ===========================================

        function normalisasiStatus(status) {

            const s = String(status || "").trim().toLowerCase();

            if (s === "dikonfirmasi") return "Dikonfirmasi";
            if (s === "selesai") return "Selesai";
            if (s === "ditutup") return "Ditutup";

            return "Menunggu Konfirmasi";

        }


        // ===========================================
        // STATUS CLASS
        // ===========================================

        function getStatusClass(status) {

            switch (status) {

                case "Menunggu Konfirmasi":
                    return "menunggu";

                case "Dikonfirmasi":
                    return "dikonfirmasi";

                case "Selesai":
                    return "selesai";

                case "Ditutup":
                    return "ditutup";

                default:
                    return "menunggu";

            }

        }


        // ===========================================
        // PENCARIAN
        // Semua kata yang diketik harus ada di salah satu
        // kolom laporan (tidak peduli huruf besar/kecil).
        // ===========================================

        function cocokDenganPencarian(item, kunci) {

            if (!kunci) {
                return true;
            }

            const d = item.data;

            const teks = [
                item.id,
                d.judulLaporan,
                d.namaPelapor,
                d.nomorRumah,
                d.flat,
                d.jenisLaporan,
                d.lokasi,
                d.waktuKejadian,
                d.deskripsi,
                d.tindakanPetugas,
                normalisasiStatus(d.status)
            ]
                .map((v) =>
                    typeof v === "string" || typeof v === "number"
                        ? String(v)
                        : ""
                )
                .join(" ")
                .toLowerCase();

            return kunci
                .split(/\s+/)
                .every((kata) => teks.includes(kata));

        }


        // ===========================================
        // WAKTU LAPORAN (untuk pengurutan)
        // Mengubah Timestamp Firestore / Date / angka / teks
        // tanggal menjadi milidetik. Hasil null = tidak terbaca.
        // ===========================================

        // Nama field waktu pembuatan laporan yang dicoba, berurutan.
        // Sesuaikan dengan field yang disimpan halaman pelapor.
        const FIELD_WAKTU_LAPORAN = [
            "createdAt",
            "tanggalLaporan",
            "waktuLaporan",
            "tanggalDibuat",
            "timestamp"
        ];


        function waktuLaporan(data) {

            for (const field of FIELD_WAKTU_LAPORAN) {

                const t = keMillis(data[field]);

                if (t !== null) {
                    return t;
                }

            }

            // Cadangan: waktu kejadian. Tanpa waktu sama sekali = paling bawah.
            const kejadian = keMillis(data.waktuKejadian);

            return kejadian !== null ? kejadian : 0;

        }


        // ===========================================
        // BUAT CARD
        // ===========================================

        function buatCard(id, data) {

            const status = normalisasiStatus(data.status);

            const statusClass = getStatusClass(status);


            // ==========================
            // TOMBOL
            // ==========================

            let actionHTML = "";


            if (status === "Menunggu Konfirmasi") {

                actionHTML = `

                    <div class="actions">

                        <button
                            type="button"
                            class="btn btn-konfirmasi"
                            data-action="konfirmasi"
                            data-id="${escapeHTML(id)}"
                        >
                            Konfirmasi Laporan
                        </button>

                    </div>

                `;

            }


            else if (status === "Dikonfirmasi") {

                actionHTML = `

                    <div class="actions">

                        <button
                            type="button"
                            class="btn btn-selesai"
                            data-action="selesai"
                            data-id="${escapeHTML(id)}"
                        >
                            Selesai
                        </button>


                        <button
                            type="button"
                            class="btn btn-ditutup"
                            data-action="ditutup"
                            data-id="${escapeHTML(id)}"
                        >
                            Ditutup
                        </button>

                    </div>

                `;

            }


            else {

                actionHTML = `

                    <div class="status-final">

                        ✓ Laporan telah
                        <strong>${escapeHTML(status.toLowerCase())}</strong>.

                    </div>

                `;

            }


            // ==========================
            // CARD
            // ==========================

            const card = document.createElement("div");

            card.className = "pengaduan-card";


            card.innerHTML = `

                <div class="card-header">

                    <div class="card-title">

                        <h2>${escapeHTML(data.judulLaporan || "-")}</h2>

                        <div class="card-id">
                            ID: ${escapeHTML(id)}
                        </div>

                    </div>


                    <span class="status ${statusClass}">
                        ${escapeHTML(status)}
                    </span>

                </div>


                <div class="info-grid">

                    <div class="info">
                        <span class="info-label">Nama Pelapor</span>
                        <span class="info-value">${escapeHTML(data.namaPelapor || "-")}</span>
                    </div>


                    <div class="info">
                        <span class="info-label">No. Rumah</span>
                        <span class="info-value">${escapeHTML(data.nomorRumah || "-")}</span>
                    </div>


                    <div class="info">
                        <span class="info-label">Flat</span>
                        <span class="info-value">${escapeHTML(data.flat || "-")}</span>
                    </div>


                    <div class="info">
                        <span class="info-label">Jenis Laporan</span>
                        <span class="info-value">${escapeHTML(data.jenisLaporan || "-")}</span>
                    </div>


                    <div class="info">
                        <span class="info-label">Lokasi</span>
                        <span class="info-value">${escapeHTML(data.lokasi || "-")}</span>
                    </div>


                    <div class="info">
                        <span class="info-label">Waktu Kejadian</span>
                        <span class="info-value">${escapeHTML(data.waktuKejadian || "-")}</span>
                    </div>

                </div>


                <div class="description">

                    <span class="description-title">
                        Kronologi / Deskripsi
                    </span>

                    ${escapeHTML(data.deskripsi || "-")}

                </div>


                <div class="tindakan">

                    <span class="tindakan-title">
                        Tindakan Petugas
                    </span>

                    ${escapeHTML(data.tindakanPetugas || "Belum ada tindakan petugas.")}

                </div>


                ${actionHTML}

            `;


            return card;

        }


        // ===========================================
        // RENDER
        // Dipanggil setiap data Firestore berubah
        // dan setiap kali kata pencarian berubah.
        // ===========================================

        function render() {

            const kunci = kataCari.trim().toLowerCase();

            const hasil = [...semuaPengaduan].sort(bandingkanTerbaru).filter(
                (item) => cocokDenganPencarian(item, kunci)
            );


            jumlahLaporan.textContent = kunci
                ? `${hasil.length} dari ${semuaPengaduan.length} Laporan`
                : `${semuaPengaduan.length} Laporan`;


            daftarPengaduan.innerHTML = "";


            // ==============================
            // BELUM ADA DATA
            // ==============================

            if (semuaPengaduan.length === 0) {

                daftarPengaduan.innerHTML = `

                    <div class="empty">

                        <div class="empty-icon">📭</div>

                        <h2>Belum Ada Pengaduan</h2>

                        <p>Laporan baru akan muncul di sini.</p>

                    </div>

                `;

                return;

            }


            // ==============================
            // PENCARIAN TIDAK ADA HASIL
            // ==============================

            if (hasil.length === 0) {

                daftarPengaduan.innerHTML = `

                    <div class="empty">

                        <div class="empty-icon">🔍</div>

                        <h2>Laporan Tidak Ditemukan</h2>

                        <p>
                            Tidak ada laporan yang cocok dengan
                            "${escapeHTML(kataCari.trim())}".
                        </p>

                    </div>

                `;

                return;

            }


            hasil.forEach((item) => {
                daftarPengaduan.appendChild(
                    buatCard(item.id, item.data)
                );
            });

        }


        // ===========================================
        // INPUT PENCARIAN (langsung mencari saat mengetik)
        // ===========================================

        inputCari.addEventListener("input", () => {

            kataCari = inputCari.value;

            render();

        });


        // ===========================================
        // FIRESTORE
        // ===========================================

        const pengaduanRef = collection(db, "pengaduan");


        onSnapshot(

            pengaduanRef,

            (snapshot) => {

                semuaPengaduan = [];

                snapshot.forEach((docSnapshot) => {

                    semuaPengaduan.push({
                        id: docSnapshot.id,
                        data: docSnapshot.data({ serverTimestamps: "estimate" })
                    });

                });

                // Terbaru di atas, terlama di bawah
                semuaPengaduan.sort(
                    (a, b) => waktuLaporan(b.data) - waktuLaporan(a.data)
                );

                render();

            },


            // =======================================
            // ERROR
            // =======================================

            (error) => {

                console.error("Firestore error:", error);

                daftarPengaduan.innerHTML = `

                    <div class="error">

                        <strong>Gagal mengambil data pengaduan.</strong>

                        <br><br>

                        ${escapeHTML(error.message)}

                    </div>

                `;

            }

        );


        // ===========================================
        // EVENT TOMBOL
        // ===========================================

        daftarPengaduan.addEventListener("click", async (event) => {

            const button = event.target.closest("[data-action]");

            if (!button) {
                return;
            }


            const id = button.dataset.id;

            const action = button.dataset.action;


            let statusBaru = "";

            let tindakanBaru = "";

            let fieldTambahan = {};

            let pesanKonfirmasi = "";


            // ==================================
            // KONFIRMASI
            // ==================================

            if (action === "konfirmasi") {

                statusBaru = "Dikonfirmasi";

                tindakanBaru = "Laporan telah dikonfirmasi oleh petugas.";

                pesanKonfirmasi = "Apakah laporan ini ingin dikonfirmasi?";

                fieldTambahan = { confirmedAt: serverTimestamp() };

            }


            // ==================================
            // SELESAI
            // ==================================

            else if (action === "selesai") {

                statusBaru = "Selesai";

                tindakanBaru = "Laporan telah diselesaikan oleh petugas.";

                pesanKonfirmasi = "Apakah laporan ini sudah selesai?";

                fieldTambahan = { selesaiAt: serverTimestamp() };

            }


            // ==================================
            // DITUTUP
            // ==================================

            else if (action === "ditutup") {

                statusBaru = "Ditutup";

                tindakanBaru = "Laporan telah ditutup oleh petugas.";

                pesanKonfirmasi = "Apakah laporan ini ingin ditutup?";

                fieldTambahan = { ditutupAt: serverTimestamp() };

            }


            else {

                return;

            }


            // ==================================
            // KONFIRMASI USER
            // ==================================

            const yakin = confirm(pesanKonfirmasi);

            if (!yakin) {
                return;
            }


            // ==================================
            // TOMBOL DISABLE
            // ==================================

            button.disabled = true;

            button.textContent = "Memproses...";


            try {

                await updateDoc(

                    doc(db, "pengaduan", id),

                    {
                        status: statusBaru,

                        tindakanPetugas: tindakanBaru,

                        updatedAt: serverTimestamp(),

                        ...fieldTambahan
                    }

                );

                console.log("Berhasil mengubah status:", statusBaru);

            }


            catch (error) {

                console.error("Gagal update Firestore:", error);

                alert(
                    "Gagal memproses pengaduan.\n\n" +
                    error.message
                );

                button.disabled = false;

                button.textContent = "Coba Lagi";

            }

        });

    </script>

</body>

</html>
