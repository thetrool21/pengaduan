<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Daftar Pengaduan</title>

    <link rel="stylesheet" href="../css/index.css">
</head>

<body>

    <div class="container">

        <!-- =========================
             HEADER
        ========================== -->

        <div class="header">

           <div class="header-top">

    <div class="header-title">
        <h1>Daftar Pengaduan</h1>
        <p>Daftar laporan pengaduan yang telah dibuat</p>
    </div>

    <a href="Tambah.html" class="btn-tambah">
        <span class="plus">+</span>
        Tambah
    </a>

    </div>

        </div>


        <!-- =========================
             DAFTAR PENGADUAN
        ========================== -->

        <div
            class="pengaduan-list"
            id="pengaduan-list"
        >

            <!-- Loading -->

            <div class="tidak-ada-data">
                Memuat pengaduan...
            </div>

        </div>

    </div>


    <!-- =========================
         FIREBASE
    ========================== -->

   <script type="module">
    import { db } from "../js/firebase-config.js";

    import {
        collection,
        query,
        orderBy,
        onSnapshot
    } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

    const daftarPengaduan = document.querySelector(".pengaduan-list");

    const pengaduanRef = collection(db, "pengaduan");

    // Terbaru → terlama
    const pengaduanQuery = query(
        pengaduanRef,
        orderBy("createdAt", "desc")
    );

    onSnapshot(
        pengaduanQuery,
        (snapshot) => {

            daftarPengaduan.innerHTML = "";

            if (snapshot.empty) {
                daftarPengaduan.innerHTML = `
                    <div class="tidak-ada-data">
                        <div class="empty-icon">📭</div>
                        <h3>Belum Ada Pengaduan</h3>
                        <p>
                            Belum ada laporan yang dibuat.
                        </p>
                    </div>
                `;
                return;
            }

            snapshot.forEach((doc, index) => {

                const data = doc.data();
                const id = doc.id;

                // =========================
                // TANGGAL
                // =========================
                let tanggal = "Tanggal tidak tersedia";

                if (data.createdAt) {
                    try {
                        tanggal = data.createdAt
                            .toDate()
                            .toLocaleDateString("id-ID", {
                                day: "numeric",
                                month: "long",
                                year: "numeric"
                            });
                    } catch (error) {
                        tanggal = "Tanggal tidak tersedia";
                    }
                }

                // =========================
                // KATEGORI
                // =========================
                let classKategori = "asing";

                if (data.jenisLaporan === "Pencurian") {
                    classKategori = "pencurian";
                } else if (
                    data.jenisLaporan === "Kerusakan Fasilitas"
                ) {
                    classKategori = "kerusakan";
                }

                // =========================
                // STATUS
                // =========================
                const status = data.status || "Menunggu Konfirmasi";

                let statusClass = "menunggu";
                let statusIcon = "⏳";

                if (status === "Sedang Diproses") {
                    statusClass = "diproses";
                    statusIcon = "🔄";
                }

                if (status === "Selesai") {
                    statusClass = "selesai";
                    statusIcon = "✓";
                }

                if (status === "Ditutup") {
                    statusClass = "ditutup";
                    statusIcon = "🔒";
                }

                // =========================
                // FOTO
                // =========================
                const foto =
                    data.fotoUrl ||
                    "https://images.unsplash.com/photo-1581578731548-c64695cc6952?w=800";

                // =========================
                // CARD
                // =========================
                const card = document.createElement("article");

                card.className = "pengaduan-card";

                card.innerHTML = `

                    <div class="pengaduan-image">

                        <img
                            src="${foto}"
                            alt="${data.jenisLaporan || "Pengaduan"}"
                        >

                        <span class="status-badge ${statusClass}">
                            <span>${statusIcon}</span>
                            ${status}
                        </span>

                    </div>


                    <div class="pengaduan-content">

                        <div class="pengaduan-top">

                            <span class="kategori ${classKategori}">
                                ${data.jenisLaporan || "Pengaduan"}
                            </span>

                            <span class="tanggal">
                                ${tanggal}
                            </span>

                        </div>


                        <h2>
                            ${data.judulLaporan || "Tanpa Judul"}
                        </h2>


                        <div class="card-footer">

                            <div class="report-info">
                                <span>👤</span>
                                ${data.namaPelapor || "Anonim"}
                            </div>


                            <a
                                href="detail.html?id=${id}"
                                class="btn-detail"
                            >
                                Lihat Detail
                                <span>→</span>
                            </a>

                        </div>

                    </div>
                `;

                daftarPengaduan.appendChild(card);
            });
        },

        (error) => {

            console.error(
                "Gagal mengambil pengaduan:",
                error
            );

            daftarPengaduan.innerHTML = `
                <div class="tidak-ada-data error">
                    <div class="empty-icon">⚠️</div>
                    <h3>Gagal Memuat Laporan</h3>
                    <p>
                        Silakan periksa koneksi atau konfigurasi Firebase.
                    </p>
                </div>
            `;
        }
    );
</script>
</body>

</html>
